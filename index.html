<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moja Rutyna</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
font-family: ‘Jost’, Helvetica, Arial, sans-serif;
background-color: #faf7f4;
color: #1e1218;
min-height: 100vh;
padding-bottom: 120px;
}

/* HEADER */
.app-header {
background-color: #7a1f2e;
padding: 52px 24px 22px;
}
.header-row {
display: flex;
justify-content: space-between;
align-items: flex-start;
margin-bottom: 10px;
}
.app-title {
font-family: ‘Playfair Display’, Georgia, serif;
font-size: 28px;
font-weight: 400;
color: #ffffff;
line-height: 1.15;
}
.app-title em { font-style: italic; color: #f0b0c0; }
.header-date {
font-size: 11px;
font-weight: 500;
letter-spacing: 0.1em;
text-transform: uppercase;
color: rgba(255,255,255,0.55);
text-align: right;
line-height: 1.7;
}
.today-pill {
display: inline-flex;
align-items: center;
gap: 6px;
padding: 5px 14px;
border-radius: 20px;
background-color: rgba(255,255,255,0.15);
border: 1px solid rgba(255,255,255,0.25);
font-size: 11px;
font-weight: 600;
letter-spacing: 0.09em;
text-transform: uppercase;
color: #f8d0da;
margin-top: 4px;
}

/* WEEK BAR */
.week-bar {
background-color: #f0e8e4;
padding: 12px 16px 10px;
border-bottom: 1px solid #e0d0cc;
display: flex;
justify-content: space-between;
}
.wd {
flex: 1;
text-align: center;
}
.wd-name {
font-size: 9px;
font-weight: 600;
letter-spacing: 0.07em;
text-transform: uppercase;
color: #8a7070;
margin-bottom: 5px;
}
.wd-pill {
padding: 4px 3px;
border-radius: 6px;
font-size: 8px;
font-weight: 600;
text-align: center;
letter-spacing: 0.02em;
margin: 0 2px;
}
.wp-acid    { background-color: #d0eedd; color: #1a5535; }
.wp-retinol { background-color: #ead8f5; color: #5a1880; }
.wp-peel    { background-color: #d5e5f8; color: #1a3870; }
.wp-rest    { background-color: #ede5d0; color: #6a5020; }
.wd-today .wd-pill {
outline: 2.5px solid #a83347;
outline-offset: 2px;
}
.wd-today .wd-name { color: #a83347; font-weight: 700; }

/* MAIN */
.main-wrap { padding: 16px 18px 0; max-width: 540px; margin: 0 auto; }

.section-head {
display: flex;
align-items: center;
gap: 12px;
padding: 18px 0 14px;
}
.section-icon {
width: 38px; height: 38px;
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 18px; flex-shrink: 0;
}
.icon-am { background-color: #fde8b0; }
.icon-pm { background-color: #ddd0f0; }
.section-title {
font-family: ‘Playfair Display’, Georgia, serif;
font-size: 22px;
font-weight: 400;
color: #1e1218;
flex: 1;
}
.section-count {
font-size: 11px;
color: #8a7070;
font-weight: 500;
}

.steps { display: flex; flex-direction: column; gap: 10px; }

/* STEP CARD */
.step-card {
background-color: #ffffff;
border: 1.5px solid #e0d4d0;
border-radius: 16px;
overflow: hidden;
transition: border-color 0.2s;
}
.step-card.is-active {
border-color: #a83347;
box-shadow: 0 0 0 3px rgba(168,51,71,0.1);
}
.step-card.is-done {
opacity: 0.52;
}
.step-card.is-done .step-header {
background-color: #eaf5ee;
}

.step-header {
display: flex;
align-items: center;
gap: 12px;
padding: 14px 16px;
cursor: pointer;
background-color: #ffffff;
}
.step-num {
width: 24px; height: 24px;
border-radius: 50%;
border: 2px solid #ddd0cc;
display: flex; align-items: center; justify-content: center;
font-size: 11px; font-weight: 600;
color: #8a7070;
flex-shrink: 0;
background-color: #faf7f4;
}
.step-card.is-done .step-num {
background-color: #3d7a5a;
border-color: #3d7a5a;
color: #ffffff;
}
.step-card.is-active .step-num {
background-color: #fce8ec;
border-color: #a83347;
color: #7a1f2e;
}

.step-name {
flex: 1;
min-width: 0;
}
.step-product {
font-size: 14px;
font-weight: 500;
color: #1e1218;
line-height: 1.3;
margin-bottom: 1px;
}
.step-brand {
font-size: 11px;
color: #8a7070;
}
.step-badge {
padding: 3px 9px;
border-radius: 8px;
font-size: 9px;
font-weight: 700;
letter-spacing: 0.06em;
text-transform: uppercase;
flex-shrink: 0;
}
.badge-vitc    { background-color: #fdecd5; color: #8a4a10; }
.badge-niacin  { background-color: #daeaf8; color: #1a4090; }
.badge-retinol { background-color: #f0ddf8; color: #6a1888; }
.badge-acid    { background-color: #d8f0e4; color: #1a5830; }
.badge-peel    { background-color: #d5e8f8; color: #1a3878; }

/* STEP BODY */
.step-body {
padding: 4px 16px 16px 52px;
display: none;
}
.step-card.is-open .step-body { display: block; }

.step-note {
font-size: 13px;
color: #4a3838;
line-height: 1.7;
margin-bottom: 14px;
}

/* TIMER */
.timer-box {
background-color: #f5eeea;
border-radius: 12px;
padding: 14px 16px;
display: flex;
align-items: center;
gap: 14px;
}
.timer-svg { flex-shrink: 0; }
.t-bg { fill: none; stroke: #ddd0c8; stroke-width: 3.5; }
.t-fg { fill: none; stroke: #a83347; stroke-width: 3.5; stroke-linecap: round; }
.t-fg.t-done { stroke: #3d7a5a; }

.timer-text-wrap { flex: 1; }
.timer-num {
font-family: ‘Playfair Display’, Georgia, serif;
font-size: 30px;
font-weight: 400;
color: #1e1218;
line-height: 1;
margin-bottom: 2px;
}
.timer-num.t-done-color { color: #3d7a5a; }
.timer-sub {
font-size: 10px;
font-weight: 600;
letter-spacing: 0.09em;
text-transform: uppercase;
color: #8a7070;
}

.timer-start {
padding: 9px 18px;
border-radius: 10px;
background-color: #7a1f2e;
border: none;
color: #ffffff;
font-family: ‘Jost’, Helvetica, Arial, sans-serif;
font-size: 13px;
font-weight: 600;
cursor: pointer;
letter-spacing: 0.04em;
flex-shrink: 0;
transition: background-color 0.15s;
}
.timer-start:active { background-color: #a83347; }
.timer-start.t-running { background-color: #f0e8ea; border: 1.5px solid #e0c8cc; color: #8a5060; }
.timer-start.t-finished { background-color: #3d7a5a; }

/* SECTION DIVIDER */
.divider { height: 1px; background-color: #e0d4d0; margin: 22px 0 0; }

/* FLOAT TIMER */
#floatTimer {
position: fixed;
bottom: 0; left: 0; right: 0;
background-color: #7a1f2e;
padding: 14px 24px 30px;
display: none;
align-items: center;
gap: 16px;
z-index: 100;
box-shadow: 0 -4px 24px rgba(100,20,30,0.3);
}
#floatTimer.show { display: flex; }
.float-progress {
position: absolute;
top: 0; left: 0; right: 0; height: 3px;
background-color: rgba(255,255,255,0.15);
}
.float-bar {
height: 100%;
background-color: #f0b0c0;
transition: width 1s linear;
width: 0%;
}
.float-info { flex: 1; }
.float-label-text {
font-size: 10px;
font-weight: 600;
letter-spacing: 0.09em;
text-transform: uppercase;
color: rgba(255,255,255,0.6);
margin-bottom: 2px;
}
.float-countdown {
font-family: ‘Playfair Display’, Georgia, serif;
font-size: 26px;
font-weight: 400;
color: #ffffff;
line-height: 1;
}
.float-stop {
padding: 9px 18px;
border-radius: 10px;
background-color: rgba(255,255,255,0.15);
border: 1px solid rgba(255,255,255,0.3);
color: #ffffff;
font-family: ‘Jost’, Helvetica, Arial, sans-serif;
font-size: 12px;
font-weight: 600;
cursor: pointer;
letter-spacing: 0.04em;
}
</style>

</head>
<body>

<!-- HEADER -->

<div class="app-header">
  <div class="header-row">
    <div class="app-title">Moja <em>Rutyna</em></div>
    <div class="header-date" id="headerDate"></div>
  </div>
  <div class="today-pill" id="todayPill"></div>
</div>

<!-- WEEK -->

<div class="week-bar" id="weekBar"></div>

<!-- MAIN -->

<div class="main-wrap">
  <div class="section-head">
    <div class="section-icon icon-am">🌤</div>
    <div class="section-title">Rano</div>
    <div class="section-count" id="amCount"></div>
  </div>
  <div class="steps" id="amSteps"></div>

  <div class="divider"></div>

  <div class="section-head">
    <div class="section-icon icon-pm">🌙</div>
    <div class="section-title">Wieczór</div>
    <div class="section-count" id="pmCount"></div>
  </div>
  <div class="steps" id="pmSteps"></div>
</div>

<!-- FLOAT TIMER -->

<div id="floatTimer">
  <div class="float-progress"><div class="float-bar" id="floatBar"></div></div>
  <div class="float-info">
    <div class="float-label-text">Odczekaj</div>
    <div class="float-countdown" id="floatCountdown">0:00</div>
  </div>
  <button class="float-stop" onclick="stopTimer()">✕ Stop</button>
</div>

<script>
const DAYS       = ['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];
const DAYS_SHORT = ['Nd','Pn','Wt','Śr','Cz','Pt','Sb'];
const DOW        = new Date().getDay();

const SCHEDULE = {
  1:{type:'acid',    label:'Kwas Azelainowy', wc:'wp-acid'},
  2:{type:'retinol', label:'Retinol',         wc:'wp-retinol'},
  3:{type:'peel',    label:'Peeling',         wc:'wp-peel'},
  4:{type:'acid',    label:'Kwas Azelainowy', wc:'wp-acid'},
  5:{type:'retinol', label:'Retinol',         wc:'wp-retinol'},
  6:{type:'retinol', label:'Retinol',         wc:'wp-retinol'},
  0:{type:'rest',    label:'Przerwa',         wc:'wp-rest'},
};

const WL = {acid:'Kwas', retinol:'Ret.', peel:'Peel', rest:'Prz.'};

const AM = [
  {id:'am0', p:'Clean Me Soft',            b:'Veoli Botanica',                        note:'Masuj delikatnie 60 sekund, spłucz letnią wodą.', w:60,  wl:'1 min'},
  {id:'am1', p:'Vitamin C Serum',          b:'The Ordinary — Ascorbyl Glucoside 12%', note:'Kilka kropli na suchą skórę, wklepać delikatnie.', w:150, wl:'2–3 min', badge:'badge-vitc', bl:'Wit. C'},
  {id:'am2', p:'Niacinamide 10% + Zinc',   b:'The Ordinary',                          note:'Kilka kropli, rozsmarować równomiernie po twarzy.', w:120, wl:'2 min', badge:'badge-niacin', bl:'Niacynamid'},
  {id:'am3', p:'Rosaliac AR Concentrate',  b:'La Roche-Posay',                        note:'Na całą twarz — optycznie neutralizuje zaczerwienienia.', w:120, wl:'2 min'},
  {id:'am4', p:'Toleriane Sensitive',      b:'La Roche-Posay',                        note:'Cienka warstwa nawilżenia przed SPF.', w:150, wl:'2–3 min'},
  {id:'am5', p:'Anthelios UV Correct SPF50+', b:'La Roche-Posay',                     note:'Min. ¼ łyżeczki. Ostatni krok — nie wcierać, rozsmarować delikatnie. Nawet w domu!', w:0},
];

function getPM(type) {
  const s0 = {id:'pm0', p:'Clean Me Soft', b:'Veoli Botanica', note:'Masuj 60 sek, spłucz letnią wodą.', w:60, wl:'1 min'};
  const s2 = {id:'pm2', p:'Cicaplast Baume B5', b:'La Roche-Posay', note:'Hojna warstwa — zamknięcie po aktywnych. Regeneruje barierę skórną.', w:0};
  const sr = {id:'pm1', p:'Toleriane Double Repair', b:'La Roche-Posay', note:'Hojna warstwa. Dzień przerwy — czas na pełną regenerację.', w:0};
  const act = {
    acid:    {id:'pm1', p:'Theramid Azid — Azelaic Acid 15%', b:'Theramid',        note:'Cienka warstwa na całą twarz. Można nakładać blisko oczu.', w:480, wl:'5–10 min', badge:'badge-acid', bl:'Kwas Az.'},
    retinol: {id:'pm1', p:'Retinol 0,05%', b:'Greek & Gorgeous',                   note:'Kilka kropli na SUCHĄ skórę. Omijaj okolice oczu.', w:480, wl:'5–10 min', badge:'badge-retinol', bl:'Retinol'},
    peel:    {id:'pm1', p:'Lactic Acid 5%', b:'The Ordinary',                      note:'Równomiernie na całą twarz. Nie łączyć z innymi aktywnymi.', w:480, wl:'5–10 min', badge:'badge-peel', bl:'Peeling'},
  };
  if (type==='rest') return [s0, sr];
  return [s0, act[type], s2];
}

// STATE
const sched = SCHEDULE[DOW];
let done = new Set();
let timer = null; // {id, left, total, iv}
let expanded = new Set();

function fmt(s) {
  s = Math.max(0, s);
  return Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');
}

function buildCard(step, idx) {
  const id = step.id;
  const isDone  = done.has(id);
  const isAct   = timer && timer.id === id;
  const isOpen  = expanded.has(id) || isAct || isDone;
  const circ    = 2*Math.PI*17;
  const left    = isAct ? timer.left : (step.w || 0);
  const offset  = isAct ? circ*(1 - left/timer.total) : 0;
  const tdone   = isAct && timer.left <= 0;

  let timerHTML = '';
  if (step.w > 0) {
    timerHTML = `
      <div class="timer-box">
        <svg class="timer-svg" width="42" height="42" viewBox="0 0 42 42">
          <circle class="t-bg" cx="21" cy="21" r="17"/>
          <circle class="t-fg${tdone?' t-done':''}" id="tfg-${id}" cx="21" cy="21" r="17"
            stroke-dasharray="${circ.toFixed(1)}"
            stroke-dashoffset="${offset.toFixed(1)}"
            transform="rotate(-90 21 21)"/>
        </svg>
        <div class="timer-text-wrap">
          <div class="timer-num${tdone?' t-done-color':''}" id="tn-${id}">${fmt(left)}</div>
          <div class="timer-sub">${step.wl||''}</div>
        </div>
        <button class="timer-start${isAct&&timer.left>0?' t-running':''}${tdone?' t-finished':''}"
          id="tbtn-${id}"
          onclick="event.stopPropagation();onTimerBtn('${id}',${step.w})">
          ${tdone ? '✓' : isAct ? '⏸' : '▶ Start'}
        </button>
      </div>`;
  }

  return `
  <div class="step-card${isDone?' is-done':''}${isAct?' is-active':''}${isOpen?' is-open':''}"
       id="sc-${id}" onclick="toggle('${id}')">
    <div class="step-header">
      <div class="step-num">${isDone?'✓':idx+1}</div>
      <div class="step-name">
        <div class="step-product">${step.p}</div>
        <div class="step-brand">${step.b}</div>
      </div>
      ${step.badge ? `<div class="step-badge ${step.badge}">${step.bl}</div>` : ''}
    </div>
    <div class="step-body">
      <div class="step-note">${step.note}</div>
      ${timerHTML}
    </div>
  </div>`;
}

function render() {
  const pm = getPM(sched.type);
  document.getElementById('amSteps').innerHTML = AM.map(buildCard).join('');
  document.getElementById('pmSteps').innerHTML = pm.map(buildCard).join('');
}

function toggle(id) {
  if (expanded.has(id)) expanded.delete(id);
  else expanded.add(id);
  render();
}

function onTimerBtn(id, total) {
  if (timer && timer.id === id && timer.left > 0) {
    // pause
    clearInterval(timer.iv);
    timer.iv = null;
    document.getElementById('floatTimer').classList.remove('show');
    document.body.style.paddingBottom = '120px';
    render();
    return;
  }
  startTimer(id, total);
}

function startTimer(id, total) {
  if (timer) clearInterval(timer.iv);
  timer = { id, total, left: total, iv: null };
  expanded.add(id);

  document.getElementById('floatTimer').classList.add('show');
  document.body.style.paddingBottom = '180px';
  render();

  timer.iv = setInterval(() => {
    timer.left--;
    updateTimerUI();
    if (timer.left <= 0) {
      clearInterval(timer.iv);
      timer.iv = null;
      onDone();
    }
  }, 1000);
}

function updateTimerUI() {
  if (!timer) return;
  const {id, left, total} = timer;
  const circ = 2*Math.PI*17;
  const tn = document.getElementById('tn-'+id);
  const tfg = document.getElementById('tfg-'+id);
  if (tn) tn.textContent = fmt(left);
  if (tfg) tfg.style.strokeDashoffset = (circ*(1-left/total)).toFixed(1);
  document.getElementById('floatCountdown').textContent = fmt(left);
  document.getElementById('floatBar').style.width = ((1-left/total)*100).toFixed(1)+'%';
}

function onDone() {
  const id = timer.id;
  done.add(id);
  document.getElementById('floatCountdown').textContent = '✓ Gotowe';
  document.getElementById('floatBar').style.width = '100%';
  document.getElementById('floatBar').style.backgroundColor = '#7ab890';
  try { navigator.vibrate && navigator.vibrate([150,80,150]); } catch(e){}

  setTimeout(() => {
    document.getElementById('floatBar').style.backgroundColor = '#f0b0c0';
    document.getElementById('floatTimer').classList.remove('show');
    document.body.style.paddingBottom = '120px';
    const nxt = nextTimer(id);
    timer = null;
    render();
    if (nxt) {
      const el = document.getElementById('sc-'+nxt.id);
      if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
      setTimeout(() => startTimer(nxt.id, nxt.w), 900);
    }
  }, 1600);
}

function nextTimer(curId) {
  const prefix = curId.startsWith('am') ? 'am' : 'pm';
  const idx = parseInt(curId.replace(prefix,''));
  const list = prefix==='am' ? AM : getPM(sched.type);
  for (let i=idx+1; i<list.length; i++) {
    if (!done.has(list[i].id) && list[i].w>0) return list[i];
  }
  if (prefix==='am') {
    const pm = getPM(sched.type);
    for (let s of pm) {
      if (!done.has(s.id) && s.w>0) return s;
    }
  }
  return null;
}

function stopTimer() {
  if (!timer) return;
  clearInterval(timer.iv);
  timer = null;
  document.getElementById('floatTimer').classList.remove('show');
  document.getElementById('floatBar').style.width = '0%';
  document.body.style.paddingBottom = '120px';
  render();
}

// INIT
function init() {
  const now = new Date();
  document.getElementById('headerDate').innerHTML =
    DAYS[DOW]+'<br>'+now.toLocaleDateString('pl-PL',{day:'numeric',month:'long'});
  document.getElementById('todayPill').textContent =
    sched.type==='rest' ? '🌿 Dzień odpoczynku' : '🌙 Wieczór: '+sched.label;

  const wb = document.getElementById('weekBar');
  [1,2,3,4,5,6,0].forEach(d => {
    const s = SCHEDULE[d];
    const isTd = d===DOW;
    const div = document.createElement('div');
    div.className = 'wd'+(isTd?' wd-today':'');
    div.innerHTML = `<div class="wd-name">${DAYS_SHORT[d]}</div>
      <div class="wd-pill ${s.wc}">${WL[s.type]}</div>`;
    wb.appendChild(div);
  });

  document.getElementById('amCount').textContent = AM.length+' kroków';
  document.getElementById('pmCount').textContent = getPM(sched.type).length+' kroki';

  render();
}
init();
</script>

</body>
</html>
